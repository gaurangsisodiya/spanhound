[project]
name = "sentinel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gaurang Sisodiya", email = "gaurangsisodiya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=1.12.0",
]

[project.scripts]
sentinel = "sentinel:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
